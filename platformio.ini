; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = CCTV_Scanner_Clean
description = escaner de CCTV y buscador de equipos

[env:CCTV_Scanner_Clean]
platform = espressif32
board = waveshare_esp32_s3_lcd_147
framework = arduino
monitor_speed = 115200
extra_scripts = 
	pre:scripts/generate_router_tables.py
lib_deps = 
	moononournation/GFX Library for Arduino@^1.5.6
	marian-craciunescu/ESP32Ping@1.7
build_flags = 
	-DARDUINO_USB_CDC_ON_BOOT=1
board_build.filesystem = littlefs
build_src_filter = +<*> -<sd_format.cpp> -<sd_spi_probe.cpp>

[env:sd_format]
platform = espressif32
board = waveshare_esp32_s3_lcd_147
framework = arduino
monitor_speed = 115200
build_flags = 
	-DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<sd_format.cpp>

[env:sd_spi_probe]
platform = espressif32
board = waveshare_esp32_s3_lcd_147
framework = arduino
monitor_speed = 115200
build_flags = 
	-DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<sd_spi_probe.cpp>
